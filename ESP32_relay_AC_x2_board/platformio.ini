; ESP32_Relay_AC_X2 (ESP32-WROOM-32E N4) – firmware thuần C trên ESP-IDF.
; Build:   pio run
; Nạp:     pio run -t upload
; Monitor: pio device monitor
; Cấu hình (chân, cực tính, topic...): pio run -t menuconfig  → menu "ESP32 Relay X2"
; Thông tin bí mật (Wi-Fi, EMQX): main/app_secrets.h (copy từ app_secrets.example.h)

[platformio]
src_dir = main
default_envs = esp32_relay_x2

[env:esp32_relay_x2]
platform = espressif32@6.9.0
framework = espidf
board = esp32dev
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.embed_txtfiles =
    main/web/index.html
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
