<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Relay X2</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#1d2330;--mut:#5d6878;--on:#1a7f37;--off:#8a94a3;--bd:#d9dee5;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#11151b;--card:#1a2029;--fg:#e8ecf2;--mut:#9aa5b5;--on:#3fb950;--off:#5d6878;--bd:#2c3440;--err:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:8px 0 4px}
.sub{color:var(--mut);font-size:.875rem;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.name{font-weight:600}
.st{font-size:.875rem;color:var(--mut)}
.st b{color:var(--off)}
.st b.on{color:var(--on)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;min-width:96px;cursor:pointer;color:#fff;background:var(--off)}
button.on{background:var(--on)}
button:disabled{opacity:.6;cursor:wait}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.875rem;color:var(--mut);margin:16px 0}
dd{margin:0;color:var(--fg)}
#msg{min-height:1.25rem;font-size:.875rem;color:var(--err)}
details{font-size:.875rem;color:var(--mut)}
input{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);margin-top:6px}
</style>
</head>
<body>
<main>
  <h1>ESP32 Relay X2</h1>
  <div class="sub" id="dev">Đang tải…</div>

  <div class="card">
    <div><div class="name">Relay 1</div><div class="st">Trạng thái: <b id="s1">—</b></div></div>
    <button id="b1" type="button" aria-label="Bật hoặc tắt Relay 1">—</button>
  </div>
  <div class="card">
    <div><div class="name">Relay 2</div><div class="st">Trạng thái: <b id="s2">—</b></div></div>
    <button id="b2" type="button" aria-label="Bật hoặc tắt Relay 2">—</button>
  </div>

  <div id="msg" role="status"></div>

  <dl>
    <dt>MQTT (EMQX)</dt><dd id="mq">—</dd>
    <dt>Wi-Fi RSSI</dt><dd id="rs">—</dd>
    <dt>Thời gian chạy</dt><dd id="up">—</dd>
    <dt>Số lần đổi</dt><dd id="sq">—</dd>
    <dt>Firmware</dt><dd id="fw">—</dd>
  </dl>

  <details>
    <summary>Khoá API (nếu đã đặt APP_HTTP_TOKEN)</summary>
    <label for="tk">Khoá</label>
    <input id="tk" type="password" autocomplete="off">
  </details>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let st = null;
let busy = false;

function tokenHeader() {
  let t = "";
  try { t = localStorage.getItem("relayToken") || ""; } catch (e) { t = ""; }
  return t ? { Authorization: "Bearer " + t } : {};
}

function fmtUptime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h + " giờ " + m + " phút " + ss + " giây";
}

function render(d) {
  st = d;
  $("dev").textContent = d.device;
  [1, 2].forEach((n) => {
    const on = d["relay" + n] === true;
    const s = $("s" + n), b = $("b" + n);
    s.textContent = on ? "BẬT" : "TẮT";
    s.className = on ? "on" : "";
    b.textContent = on ? "Tắt" : "Bật";
    b.className = on ? "on" : "";
    b.disabled = busy;
  });
  $("mq").textContent = d.mqtt ? "Đã kết nối" : "Chưa kết nối";
  $("rs").textContent = d.rssi === null ? "Chưa nối Wi-Fi nhà" : d.rssi + " dBm";
  $("up").textContent = fmtUptime(d.uptime_s);
  $("sq").textContent = d.seq;
  $("fw").textContent = d.fw;
}

async function refresh() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    render(await r.json());
    if (!busy) $("msg").textContent = "";
  } catch (e) {
    $("msg").textContent = "Mất kết nối tới thiết bị…";
  }
}

const ERR = {
  busy: "Relay vừa đổi trạng thái, chờ một chút rồi thử lại.",
  arg: "Sai khoá API hoặc lệnh thiếu trường.",
  syntax: "Lệnh sai cú pháp.",
  range: "Giá trị ngoài miền cho phép.",
  overflow: "Lệnh quá dài."
};

async function toggle(n) {
  if (busy || !st) return;
  busy = true;
  render(st);
  try {
    const r = await fetch("/api/relay", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, tokenHeader()),
      body: JSON.stringify({ relay: n, state: st["relay" + n] ? "off" : "on" })
    });
    const d = await r.json();
    if (r.ok) { $("msg").textContent = ""; busy = false; render(d); return; }
    $("msg").textContent = ERR[d.error] || ("Lỗi " + r.status);
  } catch (e) {
    $("msg").textContent = "Không gửi được lệnh.";
  }
  busy = false;
  refresh();
}

$("b1").addEventListener("click", () => toggle(1));
$("b2").addEventListener("click", () => toggle(2));
try { $("tk").value = localStorage.getItem("relayToken") || ""; } catch (e) { /* bỏ qua */ }
$("tk").addEventListener("change", (e) => {
  try { localStorage.setItem("relayToken", e.target.value); } catch (err) { /* bỏ qua */ }
});
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
