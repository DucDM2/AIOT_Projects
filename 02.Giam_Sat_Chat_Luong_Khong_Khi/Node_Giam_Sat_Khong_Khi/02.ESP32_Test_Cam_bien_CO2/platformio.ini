; Test cam bien CO2 ASAIR (Aosong) ACD10 - NDIR, 400~5000 ppm - voi ESP32
;
;   pio test -e native        -> chay toan bo unit test tren may tinh (khong can mach)
;   pio run  -e esp32_i2c     -> build firmware che do I2C (mac dinh cua cam bien: chan SET de ho)
;   pio run  -e esp32_uart    -> build firmware che do UART (chan SET noi GND)
;   pio run  -e esp32_i2c -t upload -t monitor   -> nap va mo Serial Monitor
;   pio test -e esp32_i2c     -> chay lai unit test ngay tren ESP32 that (chi can cam USB)

[platformio]
default_envs = esp32_i2c

[env]
test_framework = unity

[esp32_base]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; Lenh nhap tren Serial Monitor duoc go roi bam Enter -> bat echo de thay chu minh go
monitor_echo = yes
build_flags = -Wall -Wextra

[env:esp32_i2c]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DACD10_MODE_I2C=1

[env:esp32_uart]
extends = esp32_base
build_flags = ${esp32_base.build_flags} -DACD10_MODE_UART=1

; Unit test tren may tinh, dung chuan C++11 giong toolchain ESP32 de dam bao tuong thich
[env:native]
platform = native
build_flags = -std=gnu++11 -Wall -Wextra -Werror
test_build_src = no
