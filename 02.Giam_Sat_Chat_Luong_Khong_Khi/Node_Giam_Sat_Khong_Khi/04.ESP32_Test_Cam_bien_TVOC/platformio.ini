; Test cam bien TVOC ASAIR AGS10 (module MakerEdu MKE-S17, I2C) voi ESP32
;
;   pio test -e native        -> chay toan bo unit test + mo phong firmware tren may tinh (khong can mach)
;   pio test -e native -v     -> nhu tren, in kem log Serial Monitor mo phong
;   pio run  -e esp32         -> build firmware
;   pio run  -e esp32 -t upload -t monitor   -> nap va mo Serial Monitor
;   pio test -e esp32         -> chay lai unit test ngay tren ESP32 that (chi can cam USB)

[platformio]
default_envs = esp32

[env]
test_framework = unity

[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags = -Wall -Wextra
; mo phong firmware can Arduino gia lap, chi chay tren may tinh
test_ignore = test_firmware_sim

; Unit test tren may tinh, dung chuan C++11 giong toolchain ESP32 de dam bao tuong thich.
; test/sim_arduino: Arduino.h / Wire.h gia lap de chay nguyen src/main.cpp voi cam bien AGS10 gia lap.
[env:native]
platform = native
build_flags = -std=gnu++11 -Wall -Wextra -Werror -I"${PROJECT_DIR}/test/sim_arduino" -I"${PROJECT_DIR}/include"
test_build_src = no
