; Test gateway kho lanh qua WiFi (Wemos D1 - ESP8266) -> EMQX -> web app giam sat kho lanh
; Build:  pio run            -> .pio/build/d1/firmware.bin   (hoac tools\build.bat)
; Nap:    pio run -t upload  (hoac tools\nap.bat COMx)
; Monitor: pio device monitor
; Khong can thu vien ngoai: WiFi/TLS (BearSSL) co san trong Arduino-ESP8266, MQTT tu viet (lib/MiniMqtt).

[platformio]
default_envs = d1

[env:d1]
; Arduino-ESP8266 core 3.1.2
platform = espressif8266@4.2.1
; Wemos D1 (wemos.cc, ban 2015, dang Arduino UNO, ESP-12, flash 4 MB, USB CH340)
board = d1
framework = arduino
board_build.f_cpu = 160000000L     ; TLS (BearSSL) nhanh gap doi, giam nguy co watchdog
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
upload_speed = 460800              ; CH340 tren D1 doi khi loi o 921600
upload_resetmethod = nodemcu
monitor_filters = esp8266_exception_decoder, time
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    ; IPv4 + bo nho thap (lwIP mac dinh), tat log debug cua core
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    ; Hang doi: 300 ban tin cam bien (~5 gio, 6 KB) + 6 ban tin JSON tu PC (4 KB, du 1 luot 5 cam bien cua pc-gui-du-lieu)
    -D GW_QUEUE_CAP=300
    -D GW_RAW_CAP=6
build_src_flags =
    -Werror=format
    -Werror=return-type
