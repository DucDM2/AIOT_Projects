; Test module 4G A7680C (SIMCom) voi ESP32
; Build:  pio run            -> .pio/build/esp32dev/firmware.bin
; Nap:    pio run -t upload  (hoac dung tools/flash.bat / file merged trong release/)
; Monitor: pio device monitor

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Arduino-ESP32 2.0.17 (ESP-IDF 4.4) - ban on dinh, co dinh phien ban de build lap lai duoc
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=1
build_src_flags =
    -Werror=format
    -Werror=return-type
