; Test gateway kho lanh qua WiFi (ESP32) -> EMQX -> web app giam sat kho lanh
; Build:  pio run            -> .pio/build/esp32dev/firmware.bin   (hoac tools\build.bat)
; Nap:    pio run -t upload  (hoac tools\nap.bat COMx)
; Monitor: pio device monitor
; Khong can thu vien ngoai: WiFi/TLS co san trong Arduino-ESP32, MQTT tu viet (lib/MiniMqtt).

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Arduino-ESP32 2.0.17 (ESP-IDF 4.4) - cung phien ban voi Test_module_4G
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
lib_ldf_mode = deep+
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=1
build_src_flags =
    -Werror=format
    -Werror=return-type
